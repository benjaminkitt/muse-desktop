[package]
name = "muse-desktop"
version = "0.1.0"
edition = "2021"
description = "Lightweight Muse (muse.ai) desktop wrapper for macOS and Linux"
authors = ["muse-desktop contributors"]
license = "MIT"
repository = "https://github.com/example/muse-desktop"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: default features OFF intentionally (smallest footprint): re-enable
# exactly what this app needs — wry webview, system tray, protocol support.
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon", "common-controls-v6", "custom-protocol", "dynamic-acl", "x11", "dbus"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = "s"
